<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Современные криптографические алгоритмы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1420);
    --card: var(--tg-theme-secondary-bg-color, #1a2233);
    --text: var(--tg-theme-text-color, #f2f5fa);
    --hint: var(--tg-theme-hint-color, #8a96ad);
    --accent: var(--tg-theme-button-color, #4f8cff);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.45; padding: 16px 14px 32px;
  }
  #app { max-width: 640px; margin: 0 auto; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .hero {
    border-radius: 22px; padding: 24px 20px; color: #fff; margin-bottom: 22px;
    background: linear-gradient(135deg, #4f8cff, #8b5cf6);
    box-shadow: 0 10px 30px rgba(79, 140, 255, .3);
  }
  .hero .emoji { font-size: 40px; }
  .hero h1 { font-size: 22px; margin: 8px 0 6px; }
  .hero p { font-size: 14px; opacity: .9; }

  .cat { margin-bottom: 24px; }
  .cat h2 { font-size: 18px; margin-bottom: 4px; }
  .cat .about { font-size: 13px; color: var(--hint); margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .tile {
    background: var(--card); border-radius: 16px; padding: 14px;
    cursor: pointer; border: none; color: inherit; text-align: left; font: inherit;
    border-left: 4px solid var(--c); transition: transform .12s;
  }
  .tile:active { transform: scale(.96); }
  .tile b { display: block; font-size: 16px; margin-bottom: 4px; }
  .tile span { font-size: 12px; color: var(--hint); }

  .head {
    border-radius: 22px; padding: 22px 20px; color: #fff; margin-bottom: 14px;
    background: linear-gradient(135deg, var(--c), var(--c2));
  }
  .head .tag { font-size: 12px; opacity: .9; }
  .head h1 { font-size: 28px; margin: 4px 0; }
  .head p { font-size: 14px; opacity: .9; }

  .item { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .item h3 { font-size: 13px; color: var(--hint); font-weight: 600; margin-bottom: 6px;
             text-transform: uppercase; letter-spacing: .4px; }
  .item p, .item li { font-size: 15px; }
  .item ul { list-style: none; }
  .item li { padding: 4px 0 4px 26px; position: relative; }
  .item li::before { position: absolute; left: 0; }
  .pros li::before { content: "✅"; }
  .cons li::before { content: "⚠️"; }

  .back {
    width: 100%; margin-top: 8px; padding: 14px; border: none; border-radius: 14px;
    background: var(--accent); color: var(--tg-theme-button-text-color, #fff);
    font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
  }
  .footer { text-align: center; font-size: 12px; color: var(--hint); margin-top: 8px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const AUTHOR = "ученик 10 М класса Нашивочников Андрей"; // впиши своё имя

const CATEGORIES = {
  sym:  { title: "🔐 Симметричные шифры", c: "#4f8cff", c2: "#22d3ee",
          about: "Один и тот же секретный ключ используется и для шифрования, и для расшифрования. Работают очень быстро, ими шифруют сами данные." },
  asym: { title: "🗝 Асимметричные алгоритмы", c: "#f59e0b", c2: "#ef4444",
          about: "Используется пара ключей: открытый (его знают все) и закрытый (его знает только владелец). Нужны для обмена ключами и электронной подписи." },
  hash: { title: "🧮 Хеш-функции", c: "#10b981", c2: "#06b6d4",
          about: "Превращают данные любого размера в короткий «отпечаток» фиксированной длины. Восстановить исходные данные по хешу нельзя." },
  pq:   { title: "⚛️ Постквантовые алгоритмы", c: "#8b5cf6", c2: "#ec4899",
          about: "Новые алгоритмы, которые должны остаться стойкими даже против квантовых компьютеров. Стандартизированы в США в 2024 году." }
};

const ALGORITHMS = {
  aes: { cat: "sym", name: "AES", full: "Advanced Encryption Standard",
    type: "Симметричный блочный шифр",
    year: "Разработан в 1998 г., стандарт США с 2001 г. (FIPS 197)",
    authors: "Йоан Даймен и Винсент Рэймен (Бельгия), исходное название — Rijndael",
    params: "Блок 128 бит; ключ 128, 192 или 256 бит; 10, 12 или 14 раундов",
    idea: "Данные делятся на блоки по 128 бит. Каждый блок много раз проходит через замену байтов, сдвиг строк, перемешивание столбцов и сложение с ключом (подстановочно-перестановочная сеть).",
    security: "Практических атак на полный AES не известно. AES-256 считается стойким и к квантовым компьютерам.",
    pros: ["Очень высокая скорость (есть аппаратная поддержка в процессорах)", "Мировой стандарт, изучается более 20 лет", "Поддерживается практически везде"],
    cons: ["Без аппаратного ускорения медленнее ChaCha20", "Безопасность зависит от правильного режима работы (ECB использовать нельзя)"],
    usage: "HTTPS (TLS), Wi-Fi (WPA2/WPA3), шифрование дисков (BitLocker), архивы, мессенджеры" },

  chacha: { cat: "sym", name: "ChaCha20", full: "ChaCha20-Poly1305",
    type: "Симметричный поточный шифр",
    year: "2008 г.",
    authors: "Дэниел Бернштейн (США)",
    params: "Ключ 256 бит; одноразовое число (nonce) 96 бит; 20 раундов",
    idea: "Из ключа и nonce создаётся длинная псевдослучайная последовательность, которая складывается с текстом по XOR. Внутри только сложение, циклический сдвиг и XOR (схема ARX).",
    security: "Практических атак на полные 20 раундов не известно. Обычно используется вместе с Poly1305, который защищает данные от подмены.",
    pros: ["Быстрый на устройствах без аппаратной поддержки AES (например, на телефонах)", "Простая конструкция, легко реализовать без ошибок", "Устойчив к атакам по времени выполнения"],
    cons: ["Нельзя повторять nonce с одним и тем же ключом", "Моложе AES и изучен меньше"],
    usage: "TLS 1.3, VPN WireGuard, SSH" },

  kuznechik: { cat: "sym", name: "Кузнечик", full: "ГОСТ Р 34.12-2015",
    type: "Симметричный блочный шифр",
    year: "Стандарт принят в 2015 г., действует с 2016 г.",
    authors: "Россия (ФСБ России и компания «ИнфоТеКС»)",
    params: "Блок 128 бит; ключ 256 бит; 10 раундов",
    idea: "Как и AES, это подстановочно-перестановочная сеть: в каждом раунде выполняется сложение с ключом, замена байтов и линейное перемешивание.",
    security: "Практических атак на полный шифр не известно.",
    pros: ["Российский государственный стандарт", "Длинный ключ 256 бит", "Современный размер блока 128 бит"],
    cons: ["За пределами России используется редко", "Учёные критиковали то, что способ построения таблицы замен не был раскрыт"],
    usage: "Российские средства защиты информации, государственные информационные системы" },

  rsa: { cat: "asym", name: "RSA", full: "Rivest–Shamir–Adleman",
    type: "Асимметричный алгоритм (шифрование и электронная подпись)",
    year: "1977 г.",
    authors: "Рон Ривест, Ади Шамир, Леонард Адлеман",
    params: "Длина ключа 2048–4096 бит (меньше 2048 сегодня считается ненадёжным)",
    idea: "Перемножить два больших простых числа легко, а разложить результат обратно на множители очень трудно. На этой задаче и основана стойкость.",
    security: "Стоек против обычных компьютеров при ключе от 2048 бит. Большой квантовый компьютер сможет взломать его алгоритмом Шора.",
    pros: ["Проверен временем — используется почти 50 лет", "Подходит и для шифрования, и для подписи", "Поддерживается повсеместно"],
    cons: ["Медленный, ключи и подписи большие", "Не защищён от квантовых компьютеров", "Постепенно заменяется эллиптическими кривыми"],
    usage: "Сертификаты сайтов (HTTPS), электронная подпись, SSH, шифрование почты (PGP)" },

  ecc: { cat: "asym", name: "ECC", full: "Криптография на эллиптических кривых (ECDSA, ECDH, Ed25519)",
    type: "Асимметричные алгоритмы (обмен ключами и электронная подпись)",
    year: "Идея предложена в 1985 г.; Ed25519 — в 2011 г.",
    authors: "Нил Коблиц и Виктор Миллер (независимо друг от друга)",
    params: "Длина ключа обычно 256 бит (примерно соответствует RSA с ключом 3072 бита)",
    idea: "Используются точки на особой кривой. Умножить точку на число легко, а узнать это число по результату (дискретный логарифм) очень трудно.",
    security: "Стойки против обычных компьютеров. Как и RSA, уязвимы для квантового алгоритма Шора.",
    pros: ["Короткие ключи и подписи", "Намного быстрее RSA при той же стойкости", "Удобны для телефонов и смарт-карт"],
    cons: ["Не защищены от квантовых компьютеров", "Сложная математика — легко ошибиться в реализации"],
    usage: "TLS 1.3, мессенджеры (Signal, WhatsApp), Bitcoin (кривая secp256k1), SSH" },

  sha256: { cat: "hash", name: "SHA-256", full: "Secure Hash Algorithm 2 (семейство SHA-2)",
    type: "Криптографическая хеш-функция",
    year: "2001 г.",
    authors: "Агентство национальной безопасности США (АНБ)",
    params: "Длина хеша 256 бит; блок 512 бит; 64 раунда",
    idea: "Сообщение делится на блоки, каждый блок по очереди «перемешивается» с внутренним состоянием (конструкция Меркла — Дамгора).",
    security: "Практических атак (коллизий) не найдено.",
    pros: ["Самая распространённая хеш-функция в мире", "Высокая скорость", "Надёжность подтверждена многолетним анализом"],
    cons: ["Возможна атака удлинением сообщения (при неправильном использовании)", "Не подходит для хранения паролей — слишком быстрая"],
    usage: "Bitcoin, сертификаты сайтов, электронная подпись, проверка целостности файлов" },

  sha3: { cat: "hash", name: "SHA-3", full: "Keccak",
    type: "Криптографическая хеш-функция",
    year: "Победитель конкурса NIST в 2012 г., стандарт с 2015 г. (FIPS 202)",
    authors: "Гвидо Бертони, Йоан Даймен, Михаэль Петерс, Жиль Ван Аш",
    params: "Длина хеша 224, 256, 384 или 512 бит; состояние 1600 бит; 24 раунда",
    idea: "Конструкция «губка»: данные сначала «впитываются» во внутреннее состояние, а затем из него «выжимается» хеш нужной длины.",
    security: "Практических атак не известно. Устроена совсем иначе, чем SHA-2, поэтому служит запасным вариантом.",
    pros: ["Не подвержена атаке удлинением сообщения", "Гибкая: можно получить выход любой длины (SHAKE)", "Большой запас стойкости"],
    cons: ["Программно обычно медленнее SHA-256", "Распространена меньше, чем SHA-2"],
    usage: "Ethereum (вариант Keccak-256), постквантовые алгоритмы ML-KEM и ML-DSA" },

  streebog: { cat: "hash", name: "Стрибог", full: "ГОСТ Р 34.11-2012",
    type: "Криптографическая хеш-функция",
    year: "Стандарт принят в 2012 г.",
    authors: "Россия (ФСБ России и компания «ИнфоТеКС»)",
    params: "Длина хеша 256 или 512 бит; блок 512 бит; 12 раундов",
    idea: "Сообщение обрабатывается блоками по 512 бит с помощью функции сжатия, похожей по устройству на блочный шифр.",
    security: "Практических атак на полную функцию не известно.",
    pros: ["Российский государственный стандарт", "Длинный хеш — до 512 бит"],
    cons: ["Медленнее SHA-2", "За пределами России используется редко"],
    usage: "Российская электронная подпись (вместе с ГОСТ Р 34.10-2012), госуслуги, банки" },

  mlkem: { cat: "pq", name: "ML-KEM", full: "CRYSTALS-Kyber, стандарт FIPS 203",
    type: "Постквантовый механизм передачи ключа",
    year: "Стандарт NIST с августа 2024 г.",
    authors: "Международная группа учёных (проект CRYSTALS)",
    params: "Варианты ML-KEM-512, 768 и 1024; открытый ключ 800, 1184 или 1568 байт",
    idea: "Основан на задачах на математических решётках (Module-LWE): нужно решить систему уравнений, в которую специально добавлен «шум».",
    security: "Эффективных атак не известно ни для обычных, ни для квантовых компьютеров.",
    pros: ["Устойчив к квантовым компьютерам", "Работает очень быстро"],
    cons: ["Ключи намного больше, чем у эллиптических кривых", "Алгоритм молодой, поэтому его часто применяют вместе с классическим"],
    usage: "Гибридный обмен ключами в TLS 1.3 (браузер Chrome, Cloudflare), мессенджеры Signal и iMessage" },

  mldsa: { cat: "pq", name: "ML-DSA", full: "CRYSTALS-Dilithium, стандарт FIPS 204",
    type: "Постквантовая электронная подпись",
    year: "Стандарт NIST с августа 2024 г.",
    authors: "Международная группа учёных (проект CRYSTALS)",
    params: "Варианты ML-DSA-44, 65 и 87; подпись 2420, 3309 или 4627 байт",
    idea: "Как и ML-KEM, построен на трудных задачах на решётках (Module-LWE и Module-SIS).",
    security: "Эффективных атак не известно ни для обычных, ни для квантовых компьютеров.",
    pros: ["Устойчив к квантовым компьютерам", "Быстрое создание и проверка подписи"],
    cons: ["Подписи и ключи в десятки раз больше, чем у Ed25519", "Внедрение только начинается"],
    usage: "Постепенно внедряется в сертификаты и защищённые протоколы" }
};

// ---------- Telegram ----------
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) {
  try { tg.ready(); tg.expand(); tg.BackButton.onClick(showHome); } catch (e) {}
}
function backButton(visible) {
  if (!tg) return;
  try { visible ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
}

// ---------- Экраны ----------
const app = document.getElementById("app");

function draw(html) {
  app.innerHTML = html;
  app.style.animation = "none";
  void app.offsetWidth;          // перезапуск анимации
  app.style.animation = "";
  window.scrollTo(0, 0);
}

function showHome() {
  backButton(false);
  let html = `
    <div class="hero">
      <div class="emoji">🛡</div>
      <h1>Современные криптографические алгоритмы</h1>
      <p>Справочник по алгоритмам, которые защищают интернет, банки и мессенджеры. Нажми на алгоритм, чтобы узнать о нём всё.</p>
    </div>`;

  for (const catId in CATEGORIES) {
    const cat = CATEGORIES[catId];
    html += `<div class="cat"><h2>${cat.title}</h2><p class="about">${cat.about}</p><div class="grid">`;
    for (const algId in ALGORITHMS) {
      const a = ALGORITHMS[algId];
      if (a.cat !== catId) continue;
      html += `<button class="tile" style="--c:${cat.c}" onclick="showAlgorithm('${algId}')">
                 <b>${a.name}</b><span>${a.full}</span>
               </button>`;
    }
    html += `</div></div>`;
  }
  html += `<p class="footer">Школьный проект · Автор: ${AUTHOR}</p>`;
  draw(html);
}

function showAlgorithm(algId) {
  const a = ALGORITHMS[algId];
  const cat = CATEGORIES[a.cat];
  backButton(true);

  const block = (title, text) => `<div class="item"><h3>${title}</h3><p>${text}</p></div>`;
  const list = (title, cls, arr) =>
    `<div class="item"><h3>${title}</h3><ul class="${cls}">${arr.map(x => `<li>${x}</li>`).join("")}</ul></div>`;

  draw(`
    <div class="head" style="--c:${cat.c};--c2:${cat.c2}">
      <div class="tag">${cat.title}</div>
      <h1>${a.name}</h1>
      <p>${a.full}</p>
    </div>
    ${block("1. Тип", a.type)}
    ${block("2. Год создания", a.year)}
    ${block("3. Авторы", a.authors)}
    ${block("4. Параметры", a.params)}
    ${block("5. Как работает", a.idea)}
    ${block("6. Стойкость", a.security)}
    ${list("7. Плюсы", "pros", a.pros)}
    ${list("8. Минусы", "cons", a.cons)}
    ${block("9. Где применяется", a.usage)}
    <button class="back" onclick="showHome()">← Ко всем алгоритмам</button>
  `);
}

showHome();
</script>
</body>
</html>
